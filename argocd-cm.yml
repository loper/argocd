# Source of truth for baldur's argocd-cm (namespace argocd).
# Apply: kubectl --context baldur -n argocd apply -f argocd-cm.yml
# After changing resource.exclusions, restart argocd-application-controller
# so the informer cache drops previously watched kinds.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
data:
  accounts.admin: apiKey, login
  # Setting this key replaces Argo CD's built-in defaults — keep the
  # high-churn kinds below, and add Job so CronJob children never enter
  # the resource tree (TTL'd Jobs were stuck as "Pending deletion" /
  # undefined/undefined ghosts in Redis).
  resource.exclusions: |
    - apiGroups:
      - ""
      - discovery.k8s.io
      kinds:
      - Endpoints
      - EndpointSlice
      clusters:
      - "*"
    - apiGroups:
      - coordination.k8s.io
      kinds:
      - Lease
      clusters:
      - "*"
    - apiGroups:
      - batch
      kinds:
      - Job
      clusters:
      - "*"
