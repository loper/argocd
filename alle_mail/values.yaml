# Common values for alle_mail — shared by every environment.
# Environment-specific overrides live in values-uat.yaml / values-prod.yaml.
# This file alone does not render a complete release: namespace and image.tag
# come from the environment file, so always pass -f values-<env>.yaml.

name: alle-mail
TZ: Europe/Warsaw
revisionHistoryLimit: 2

app:
  log_file: "/home/mailer/log/output.log"

limits:
  # O16: reviewed after CACHE became bounded (01_monitor_email.py's
  # CACHE_MAXLEN=5000 — a few hundred KB of hashes at most, not the
  # unbounded growth O16 originally flagged). mem_max still comfortably
  # covers IMAP/email-body handling, so left unchanged.
  mem_min: "50Mi"
  mem_max: "550Mi"
  cpu_min: "100m"
  cpu_max: "500m"
  # O16: no pod here writes to a volume (O18 removed the last file log),
  # so this only guards against the container's writable layer growing
  # unbounded (stray temp files, a runaway log buffer) and starving the
  # node. Sized in proportion to mem_min/mem_max above, not measured
  # usage — there's no historical pressure on this axis.
  ephemeral_min: "100Mi"
  ephemeral_max: "500Mi"

image:
  # tag is set per environment by the deploy scripts
  pullPolicy: Always
  pullSecrets: gitlab

# Pin a workload to a node. null means no nodeSelector at all.
nodes:
  tracker: null # cronJob_F, cronJob_G
  traefik: null # deployment_D

image_A:
  name: 01-mail
  repository: registry.gitlab.com/k8s45/alle_mail/01_mail
  cm: config-01
  secret: token-01
  replicas: 1

image_B:
  name: 02-parser
  repository: registry.gitlab.com/k8s45/alle_mail/02_parser
  cm: config-02
  secret: token-02
  replicas: 1

image_C:
  name: 03-atable
  repository: registry.gitlab.com/k8s45/alle_mail/03_atable
  cm: config-03
  secret: token-03
  # Etap 6a: 03 is the sole NocoDB writer, so a second replica would mean
  # two writers racing with no compare-and-swap on the NocoDB side. Paired
  # with strategy: Recreate (deployment_C.yml) so a rollout can't briefly
  # run two pods either, and O12's marker-file liveness probe so a single
  # wedged pod still gets recovered automatically.
  replicas: 1

image_D:
  name: 04-status
  repository: registry.gitlab.com/k8s45/alle_mail/04_status
  cm: config-04
  secret: token-04
  replicas: 1
  internal_port: 5000
  external_port: 40054
  health_probe: /health

image_E:
  enabled: false
  name: 05-repeater
  cm: config-05
  replicas: 1

image_F:
  name: 06-tracker
  repository: registry.gitlab.com/k8s45/alle_mail/06_tracker
  cm: config-03
  secret: token-03
  schedule: "0 */3 * * *" # every 3 hours
  suspend: false
  pullPolicy: IfNotPresent
  # O15: must stay well under the tightest schedule this image runs on
  # (values-prod.yaml overrides to every 47 min = 2820s) so a wedged run
  # is killed with margin before the next trigger, instead of Forbid
  # skipping runs indefinitely. 30 min leaves ~17 min of headroom on
  # PROD and is generous for the per-item scrape calls in 06_runner.py
  # (15-20s timeouts each).
  activeDeadlineSeconds: 1800

image_G:
  name: 07-resync
  repository: registry.gitlab.com/k8s45/alle_mail/07_resync
  cm: config-03
  secret: token-03
  schedule: "0 */2 * * *" # every 2 hours
  suspend: false
  # O15: same reasoning as image_F.activeDeadlineSeconds — PROD overrides
  # this image's schedule to every 56 min = 3360s, so 30 min leaves
  # ~26 min of headroom before the next trigger.
  activeDeadlineSeconds: 1800

vault:
  common: "common"
  path_01: "mail"
  path_02: null
  path_03: "airtable"
  path_04: "airtable"
