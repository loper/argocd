---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Values.image_F.name }}
spec:
  schedule: "{{ .Values.image_F.schedule }}"
  # O15: a wedged run (e.g. a scrape target hanging past its own timeouts)
  # would otherwise pile up alongside the next scheduled trigger instead
  # of being replaced by it.
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      suspend: {{ .Values.image_F.suspend }}
      ttlSecondsAfterFinished: 3000
      # O15: kills a wedged run so it doesn't sit there forever blocking
      # every later trigger via concurrencyPolicy: Forbid above.
      activeDeadlineSeconds: {{ .Values.image_F.activeDeadlineSeconds }}
      template:
        spec:
          containers:
              - name: {{ .Values.image_F.name }}
                image: "{{ .Values.image_F.repository }}:{{ .Values.image.tag }}"
                imagePullPolicy: {{ .Values.image_F.pullPolicy }}
                tty: true
                envFrom:
                  - configMapRef:
                      name: {{ .Values.image_F.cm }}
                  - secretRef:
                      name: {{ .Values.image_F.secret }}
                env:
                  - name: IMAGE_TAG
                    value: {{ .Values.image.tag }}
                resources:
                  requests:
                    memory: {{ .Values.limits.mem_min }}
                    cpu: {{ .Values.limits.cpu_min }}
                    ephemeral-storage: {{ .Values.limits.ephemeral_min }}
                  limits:
                    memory: {{ .Values.limits.mem_max }}
                    cpu: {{ .Values.limits.cpu_max }}
                    ephemeral-storage: {{ .Values.limits.ephemeral_max }}
                securityContext:
                  allowPrivilegeEscalation: false
                  runAsNonRoot: true
                  runAsUser: 1500
                  runAsGroup: 10500
{{- with .Values.nodes.tracker }}
          nodeSelector:
            kubernetes.io/hostname: {{ . | quote }}
{{- end }}

          imagePullSecrets:
            - name: {{ .Values.image.pullSecrets }}
            
          restartPolicy: Never
