---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.image_A.name }}
spec:
  selector:
    matchLabels:
      app: {{ .Values.image_A.name }}
  replicas: {{ .Values.image_A.replicas }}
  template:
    metadata:
      labels:
        app: {{ .Values.image_A.name }}
    spec:
      containers:
        - name: {{ .Values.image_A.name }}
          image: "{{ .Values.image_A.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # command: [ "/bin/sh", "-c", "--" ]
          # args: [ "while true; do sleep 30; done;" ]
          tty: true
          envFrom:
            - configMapRef:
                name: {{ .Values.image_A.cm }}
            - secretRef:
                name: {{ .Values.image_A.secret }}
          resources:
            requests:
              memory: {{ .Values.limits.mem_min }}
              cpu: {{ .Values.limits.cpu_min }}
              ephemeral-storage: {{ .Values.limits.ephemeral_min }}
            limits:
              memory: {{ .Values.limits.mem_max }}
              cpu: {{ .Values.limits.cpu_max }}
              ephemeral-storage: {{ .Values.limits.ephemeral_max }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 500
            runAsGroup: 10500
          # O12: previously disabled entirely (the commented-out `tail`
          # probe below would only have proven the process alive anyway,
          # not that search_imap()'s poll loop wasn't wedged). The marker
          # file is touched once per poll cycle (01's touch_liveness()).
          # 10 min window / 30s interval matches this image's own
          # Dockerfile HEALTHCHECK — shorter than 02/03 since 01's poll
          # loop is expected to stay consistently active.
          #
          # startupProbe: until the marker exists at all, `find` fails
          # outright, so liveness alone would kill a pod that is merely
          # still starting — search_imap() can spend up to 300s in its
          # own connect-failure backoff before the first cycle completes.
          # Liveness is suspended until this succeeds once, so the pod
          # only ever restarts for a genuinely stale marker.
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - '[ -f /home/mailer/healthy ]'
            periodSeconds: 10
            failureThreshold: 60
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - '[ -n "$(find /home/mailer/healthy -mmin -10)" ]'
            periodSeconds: 30
            failureThreshold: 3
            # An exec probe that times out counts as a failure. Default
            # 1s is not much headroom for forking a shell under this
            # container's CPU limit when the node is busy — a throttled
            # probe is not a wedged app.
            timeoutSeconds: 5

      imagePullSecrets:
        - name: {{ .Values.image.pullSecrets }}

  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
