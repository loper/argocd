apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-fanout
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  tls:
    - hosts:
        - "{{ .Values.namespace }}.anoia.eu"
      secretName: "{{ .Values.namespace }}-tls"
  rules:
    - host: "{{ .Values.namespace }}.anoia.eu"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.name }}
                port: 
                  number: {{ .Values.image_D.external_port }}

