# PROD overrides. Everything else comes from values.yaml.

namespace: alle-mail

image:
  tag: "39202f0a" # updated by deploy_prod.sh

nodes:
  tracker: "baldur"
  traefik: "halina512"

image_B:
  replicas: 3

image_D:
  replicas: 3
  external_port: 40055

image_F:
  # Once an hour. "*/47" is minute 0 and minute 47, a 13-minute gap,
  # which is shorter than activeDeadlineSeconds, so Forbid skips the next run.
  schedule: "5 * * * *"

image_G:
  # Once an hour, after the tracker's 30-minute budget. "*/56" is minute 0
  # and minute 56, a 4-minute gap, so the same skip happens.
  schedule: "40 * * * *"

vault:
  mount_point: "alle"
